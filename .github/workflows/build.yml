name: Build

on:
  push:
    tags: [ "**" ]
    branches: [ "main", "dev", "test-ci"]

jobs:
  modding-api-regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the 3.9 minimum-version lane while Ubuntu latest covers 3.12.
          - os: ubuntu-22.04
            python_version: "3.9"
            shell_name: bash
          - os: ubuntu-latest
            python_version: "3.12"
            shell_name: bash
          - os: windows-latest
            python_version: "3.9"
            shell_name: pwsh
          # Pin the macOS line; macos-latest image drift broke dotnet build.
          - os: macos-15
            python_version: "3.9"
            shell_name: bash
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}

    - name: Install Skill Python dependencies
      run: python -m pip install --requirement skills/blasphemous-modding-helper/requirements.txt

    - name: Install optional screenshot validation dependency
      run: python -m pip install --requirement ci/requirements-image-validation.txt

    - name: Set up Node.js installer boundary
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    # Runner images now default to .NET 11, which breaks the legacy MSBuild fixture.
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Validate Skill Python runtime and dependencies
      run: python skills/blasphemous-modding-helper/scripts/check_python_environment.py --python python --requirements skills/blasphemous-modding-helper/requirements.txt

    # The acceptance runner includes the Node installer and wrapper contracts.
    - name: Run acceptance surface (Bash)
      if: matrix.shell_name == 'bash'
      shell: bash
      run: python tests/test_modding_api_acceptance.py --python python --require-clean

    - name: Run acceptance surface (PowerShell)
      if: matrix.shell_name == 'pwsh'
      shell: pwsh
      run: python tests/test_modding_api_acceptance.py --python python --require-clean

  build:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Export Settings
      run: |
        PROJECT_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
        echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
        PROJECT_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
        echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV

    - name: Smoke-test Installer (dry run)
      run: |
        SKILL_DESTINATION="$(mktemp -d)/blasphemous-modding-helper"
        node bin/install.js --dry-run --path "$SKILL_DESTINATION"
        node bin/install.js --help

    - name: Package Release
      run: |
        mkdir -p publish
        zip -r publish/${{ env.PROJECT_NAME }}.zip skills/${{ env.PROJECT_NAME }}

    # Release is created only on tag pushes; main-branch pushes just run
    # the packaging steps above as a build check.
    - name: Create GitHub Release (tags only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: v${{ env.PROJECT_VERSION }}
        draft: true
        files: |
          publish/${{ env.PROJECT_NAME }}.zip
