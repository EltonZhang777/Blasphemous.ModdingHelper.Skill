name: Build

on:
  push:
    tags: [ "**" ]
    branches: [ "main" ]

jobs:
  modding-api-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Run ModdingAPI acceptance gate on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: bash skills/blasphemous-modding-helper/scripts/test_modding_api_acceptance.sh --require-clean

    - name: Run ModdingAPI acceptance gate on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./skills/blasphemous-modding-helper/scripts/test_modding_api_acceptance.ps1 -RequireClean

  build:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Export Settings
      run: |
        PROJECT_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
        echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
        PROJECT_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
        echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV

    - name: Smoke-test Installer (dry run)
      run: |
        node bin/install.js --dry-run --only trae-cn
        node bin/install.js --dry-run --only claude-code
        node bin/install.js --help

    - name: Package Release
      run: |
        mkdir -p publish
        zip -r publish/${{ env.PROJECT_NAME }}.zip skills/${{ env.PROJECT_NAME }}
        cp install.sh publish/install.sh
        cp install.ps1 publish/install.ps1

    # Release is created only on tag pushes; main-branch pushes just run
    # the packaging steps above as a build check.
    - name: Create GitHub Release (tags only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: v${{ env.PROJECT_VERSION }}
        draft: true
        files: |
          publish/${{ env.PROJECT_NAME }}.zip
          publish/install.sh
          publish/install.ps1
